model:
  name: "PretrainedUNet" 
  params:

    pretrained_ckpt: 

    freeze_encoder: False
    use_3_channels: True
    dropout: 0.25
    use_skip_adapter: False
    
    # Paramètres du décodeur (doivent être cohérents avec l'encodeur)


    backbone_params:
      start_channels: 32
      num_blocks: 5
      pooling_type: "max"
      conv_mode: "DiNe"
    
      global_pooling: "flatten" 
      standard_ico: True
  
# model:
#   name: "SphericalDinoV2"
