#
#     dino_version: "facebook/dinov3-vitb16-pretrain-lvd1689m"

training:
  lr: 1e-4
  encoder_lr: 1e-5
  weight_decay: 1e-3
  epochs: 500
  post_train: True 

  early_stopping_patience: 8 
  early_stopping_min_delta: 0.01
  
  #
  monitor_metric: "dice"  
  monitor_mode: "max"   

  save_freq: 80
  log_freq: 1
  val_freq: 20


# --- Loss ---
loss:
  type: "dice_ce"
  dice_weight: 1.0
  ce_weight: 1.0
  ignore_index: 0

