# config.yaml 

# --- Paramètres Généraux ---

experiment_name: "test0"
device: "cuda"
seed: 42
debug: False

# --- Chemins ---
paths:
  #base_dir: "/lustre/fsn1/projects/rech/tgu/uxc45lm/pclean_freesurfer"
  base_dir: "/home/st283990/pclean_freesurfer"
 

  output_dir: "/neurospin/dico/stounsi/Runs/2025_stounsi_slabeling/output/test_transfer/${experiment_name}"
  cache_dir: "/neurospin/dico/stounsi/Runs/2025_stounsi_slabeling/models/surfify_cache"

cross_validation:
  k_folds: 4      # Nombre de folds (ex: 4 pour ~12-16 sujets par fold)
  test_ratio: 0.35     #  sujets gardés pour le Test Set final (figé)
  seed: 4            # Seed critique pour que le Test Set ne change jamais
# --- Données (Configuration du Dataset) ---
data:
  hemisphere: "rh"
  ico_order: 6
  nb_vertex_thousands: 40 #(10k for ico5 , 40k for ico6 ,  168k for ico7)
  batch_size: 10
  num_classes: 66
  in_channels: 2
  #sulci_to_unknown: -1
  sulci_to_unknown : [2]

  split_ratio: 0.5
  zhao_neigh: False  
  use_lines: False
  num_workers: 1


  inputs:


 

  # Le fichier cible (ground truth)
  target: 


  # --- Augmentations ---
  augmentations:
    # Probabilités globales
    prob_geometric: 0.8   # Rotation
    prob_intensity: 0.8   # Bruit/Scale

    # Paramètres
    noise_sigma: 0.1    # Ecart-type du bruit gaussien
    scale_limit: 0.1      # +/- 10% de scaling (0.9 à 1.1)
    rotate_angle_std: 0.0 # En radians (~30 deg). Si None, utilise pi/6 par défaut

# --- Modèle ---

# model:
